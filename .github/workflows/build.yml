name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/data | Out-Null
          Copy-Item build/Release/TrayApp.exe out/
          Copy-Item build/Release/ZiOvpoPzService.exe out/
          Copy-Item build/Release/data/default.avdb out/data/
          Copy-Item build/Release/data/public_cert.pem out/data/

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/
