name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Pack
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path out | Out-Null; Copy-Item build/Release/TrayApp.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/
